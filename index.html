<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إيصال الموعد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=IBM+Plex+Sans+Arabic:wght@500;600;700&display=swap" rel="stylesheet">
<style id="pagesize">@page{margin:0}</style>
<style>
/* Al Mawed till receipt for an 80mm thermal printer (72mm printable). Black only. */
html,body{margin:0;background:#fff;color:#000}
body{font-family:"IBM Plex Sans Arabic","Segoe UI",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r{width:72mm;margin:0 auto;padding:2mm 0 8mm;font-size:12.5px;line-height:1.35;box-sizing:border-box}
h1{font-family:"Aref Ruqaa","IBM Plex Sans Arabic",serif;font-size:32px;font-weight:700;text-align:center;margin:0;line-height:1.15}
.tag{text-align:center;font-size:11px;font-weight:500}
.hr{border-top:1.6px dashed #000;margin:2mm 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:2mm}
.row>span:first-child{min-width:0;overflow-wrap:anywhere}
.n{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.it{margin-bottom:1.6mm}
.it .nm{font-weight:700;font-size:13.5px}
.it .q{font-size:11.5px}
.tot{font-size:19px;font-weight:700}
.b{font-weight:600}
.c{text-align:center}
.small{font-size:10.5px}
.bar{display:none}
@media screen{
  body{background:#e9ece8}
  .r{background:#fff;padding:5mm 4mm 8mm;margin:16px auto;width:80mm;box-shadow:0 2px 12px rgba(0,0,0,.15)}
  .bar{display:flex;gap:8px;justify-content:center;padding:14px 16px 0;font:15px "IBM Plex Sans Arabic",Arial,sans-serif}
  .bar button{font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #1d5a3f;background:#1d5a3f;color:#fff;cursor:pointer}
  .bar button.alt{background:#fff;color:#1d5a3f}
  .msg{text-align:center;padding:40px 16px;font:16px "IBM Plex Sans Arabic",Arial,sans-serif}
}
@media print{html,body{background:#fff;margin:0;padding:0}.r{margin:0 auto;padding-top:0}.bar,.msg{display:none}}
</style>
</head>
<body>
<div class="bar"><button id="again" type="button">طباعة مجدداً</button><button id="close" class="alt" type="button">إغلاق</button></div>
<div class="r" id="r"></div>
<script>
{
  const PAY={USD:'نقداً $',LBP:'نقداً ل.ل.',WHISH:'ويش'};
  const AR='ar-LB-u-nu-latn';
  const usd=(n,sg='')=>sg+'$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  const lbp=n=>Math.round(n).toLocaleString('en-US');
  const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
  const num=txt=>el('span','n',txt);
  const row=(label,value,cls)=>{const d=el('div','row'+(cls?' '+cls:''));d.append(el('span',null,label),value);return d};
  const box=document.getElementById('r');
  let d=null;
  try{
    const m=location.hash.match(/[#&]d=([A-Za-z0-9_-]+)/);
    if(m){let b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
      const bin=atob(b),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      d=JSON.parse(new TextDecoder().decode(bytes))}
  }catch(e){d=null}
  if(!d||!Array.isArray(d.i)){
    box.replaceWith(el('div','msg','لا يوجد إيصال لطباعته. افتح هذه الصفحة من زر «طباعة الإيصال» في نظام الموعد.'));
  }else{
    box.append(el('div','tag','تبغ · معسّل · أراكيل'),el('div','hr'));
    const when=new Date(d.t);
    const top=el('div','row small');const no=el('span');no.append('إيصال رقم ',num(String(d.n||'')));
    top.append(no,el('span',null,isNaN(when)?'':when.toLocaleString(AR,{dateStyle:'short',timeStyle:'short'})));box.append(top);
    if(d.c)box.append(el('div','b','الزبون: '+String(d.c)));
    box.append(el('div','hr'));
    d.i.forEach(([name,qty,price])=>{
      const it=el('div','it');
      it.append(row(String(name),num(usd(qty*price)),'nm'));
      const q=el('div','q');q.append(String(qty)+' × ',num(usd(price)));it.append(q);box.append(it);
    });
    box.append(el('div','hr'));
    if(d.disc>0){box.append(row('قبل الخصم',num(usd(d.sub))),row('الخصم',num(usd(d.disc,'−'))))}
    box.append(row('المجموع',num(usd(d.usd)),'tot'));
    const l=el('span');l.append(num(lbp(d.lbp)),' ل.ل.');box.append(row('بالليرة',l,'b'));
    box.append(row('طريقة الدفع',el('span',null,PAY[d.pay]||'')));
    box.append(el('div','hr'),el('div','c b','شكراً لزيارتكم'));
    document.title='إيصال '+String(d.n||'');
    const fit=()=>{};
    const go=()=>{fit();window.print()};
    document.getElementById('again').addEventListener('click',go);
    window.addEventListener('afterprint',()=>{setTimeout(()=>window.close(),300)});
    const ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
    Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(()=>setTimeout(go,150));
  }
  document.getElementById('close')&&document.getElementById('close').addEventListener('click',()=>window.close());
}
</script>
</body>
</html>
